<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | CampusFix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="board wide">
    <div class="bar">
      <div>
        <div class="brand">CampusFix Admin</div>
        <h1>All reported issues</h1>
      </div>
      <button id="logout" class="ghost">Log out</button>
    </div>

    <section class="stats">
      <div><b id="sTotal">0</b><span>Reported</span></div>
      <div><b id="sPending">0</b><span>Pending</span></div>
      <div><b id="sDone">0</b><span>Resolved</span></div>
    </section>

    <section class="tools">
      <input id="search" type="search" placeholder="Search by location, student or problem">
      <div class="chips" id="chips">
        <button class="chip active" data-f="All">All</button>
        <button class="chip" data-f="Pending">Pending</button>
        <button class="chip" data-f="Resolved">Resolved</button>
      </div>
    </section>

    <section id="issueList" class="list"></section>
  </main>
  <div id="toast" role="status"></div>
  <script src="admin.js"></script>
</body>
</html>
