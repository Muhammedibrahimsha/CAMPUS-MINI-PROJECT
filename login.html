<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | CampusFix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth">
  <div class="authcard">
    <div class="brand">CampusFix</div>
    <h1 id="title">Log in to report issues</h1>

    <div class="tabs">
      <button class="tab active" data-role="student">Student</button>
      <button class="tab" data-role="admin">Admin</button>
    </div>

    <form id="loginForm">
      <label>Email<input id="lEmail" type="email" required placeholder="you@college.edu"></label>
      <label>Password<input id="lPass" type="password" required placeholder="Enter password"></label>
      <button type="submit" class="primary">Log in</button>
    </form>

    <form id="regForm" hidden>
      <label>Full name<input id="rName" required placeholder="e.g. Priya S"></label>
      <label>Email<input id="rEmail" type="email" required placeholder="you@college.edu"></label>
      <label>Password<input id="rPass" type="password" minlength="4" required placeholder="At least 4 characters"></label>
      <button type="submit" class="primary">Create account</button>
    </form>

    <p id="msg" class="msg" role="alert"></p>
    <p id="swap" class="swap">New student? <a href="#" id="toggle">Create an account</a></p>
    <p id="hint" class="hint" hidden>Demo admin login: admin@campus.com / admin123</p>
  </div>
  <script src="login.js"></script>
</body>
</html>
